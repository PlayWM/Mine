<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Line Territory - 실시간 땅따먹기</title>
  <!-- Firebase SDK (Compat 버전) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #12131a; font-family: 'Pretendard', sans-serif; color: #fff; }
    
    #gameCanvas { display: block; width: 100%; height: 100%; }

    /* 시작 모달 */
    #startScreen {
      position: absolute; inset: 0; background: rgba(18, 19, 26, 0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
    }
    .title { font-size: 2.2rem; font-weight: 900; margin-bottom: 10px; background: linear-gradient(90deg, #ff2a85, #00f0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { font-size: 0.9rem; color: #aaa; margin-bottom: 25px; text-align: center; line-height: 1.4; }
    #nicknameInput {
      padding: 14px 20px; font-size: 1.1rem; border-radius: 12px; border: 2px solid #00f0ff;
      background: #1e202b; color: #fff; outline: none; margin-bottom: 15px; text-align: center; width: 240px;
    }
    #startBtn {
      padding: 14px 40px; font-size: 1.1rem; font-weight: bold; border-radius: 12px; border: none;
      background: linear-gradient(90deg, #00f0ff, #0080ff); color: #000; cursor: pointer; box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
    }

    /* 상단 UI 레이아웃 */
    #topUI { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 10; }
    
    #minimapContainer {
      width: 105px; height: 105px; background: rgba(25, 27, 38, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.25); border-radius: 10px; overflow: hidden; position: relative;
    }
    #minimapCanvas { width: 100%; height: 100%; display: block; }

    #centerUI { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .coinBox {
      background: rgba(25, 27, 38, 0.85); border: 1.5px solid #ffd700; border-radius: 20px;
      padding: 6px 16px; font-weight: bold; font-size: 1.1rem; color: #ffd700; display: flex; align-items: center; gap: 6px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }
    #modeBadge { font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.1); color: #00ff66; }
    #statusMsg { font-size: 0.85rem; color: #00f0ff; font-weight: bold; min-height: 18px; text-shadow: 0 0 5px #000; }

    #leaderboard {
      width: 155px; background: rgba(25, 27, 38, 0.85); border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px; padding: 8px 10px; font-size: 0.8rem;
    }
    .lb-title { font-weight: bold; text-align: center; margin-bottom: 6px; color: #00f0ff; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
    .lb-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .lb-name { display: flex; align-items: center; gap: 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 100px; }
    .color-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    /* 하단 컨트롤러 & 아이템 */
    #bottomUI { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: none; z-index: 10; }
    
    #joystickZone { width: 130px; height: 130px; background: rgba(255, 255, 255, 0.06); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; position: relative; pointer-events: auto; touch-action: none; }
    #joystickKnob { width: 50px; height: 50px; background: rgba(0, 240, 255, 0.7); border-radius: 50%; position: absolute; top: 38px; left: 38px; box-shadow: 0 0 12px #00f0ff; pointer-events: none; }

    #itemSlots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; pointer-events: auto; }
    .itemBtn {
      width: 62px; height: 62px; border-radius: 50%; border: 2px solid #fff; background: rgba(30, 33, 45, 0.9);
      color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: bold; cursor: pointer; position: relative; transition: transform 0.1s;
    }
    .itemBtn:active { transform: scale(0.92); }
    .itemBtn .icon { font-size: 1.3rem; margin-bottom: 2px; }
    .itemBtn .cost { font-size: 0.65rem; color: #ffd700; }
    .btn-shield { border-color: #00f0ff; box-shadow: 0 0 8px rgba(0,240,255,0.4); }
    .btn-speed { border-color: #ffaa00; box-shadow: 0 0 8px rgba(255,170,0,0.4); }
    .btn-mine { border-color: #00ff66; box-shadow: 0 0 8px rgba(0,255,102,0.4); }
    .btn-bomb { border-color: #ff2a85; box-shadow: 0 0 8px rgba(255,42,133,0.4); }
  </style>
</head>
<body>

  <!-- 시작 화면 -->
  <div id="startScreen">
    <div class="title">LINE TERRITORY</div>
    <div class="subtitle">외곽선과 내 땅에서 안전 이동!<br>밖으로 선을 그어 상대 땅을 점령하세요.</div>
    <input type="text" id="nicknameInput" placeholder="닉네임 입력 (최대 8자)" maxlength="8">
    <button id="startBtn">게임 시작</button>
  </div>

  <!-- 상단 UI -->
  <div id="topUI">
    <div id="minimapContainer">
      <canvas id="minimapCanvas" width="60" height="60"></canvas>
    </div>
    <div id="centerUI">
      <div class="coinBox">🪙 <span id="coinText">10</span></div>
      <div id="modeBadge">🟢 실시간 서버 연결됨</div>
      <div id="statusMsg"></div>
    </div>
    <div id="leaderboard">
      <div class="lb-title">실시간 랭킹</div>
      <div id="lbList"></div>
    </div>
  </div>

  <!-- 메인 게임 캔버스 -->
  <canvas id="gameCanvas"></canvas>

  <!-- 하단 컨트롤러 및 아이템 -->
  <div id="bottomUI">
    <div id="joystickZone">
      <div id="joystickKnob"></div>
    </div>
    <div id="itemSlots">
      <button class="itemBtn btn-shield" onclick="useItem('shield')">
        <span class="icon">🛡️</span><span>보호막</span><span class="cost">5 C</span>
      </button>
      <button class="itemBtn btn-speed" onclick="useItem('speed')">
        <span class="icon">⚡</span><span>스피드</span><span class="cost">4 C</span>
      </button>
      <button class="itemBtn btn-mine" onclick="useItem('mine')">
        <span class="icon">💣</span><span>지뢰</span><span class="cost">6 C</span>
      </button>
      <button class="itemBtn btn-bomb" onclick="useItem('bomb')">
        <span class="icon">🎨</span><span>페인트탄</span><span class="cost">8 C</span>
      </button>
    </div>
  </div>

<script>
/**
 * 1. FIREBASE 설정 (PlayWm 프로젝트 적용 완료)
 */
const firebaseConfig = {
  apiKey: "AIzaSyDHEZ-Qbx4ZpNCZf4dX9oZI69WbM5HSPn4",
  authDomain: "playwm-d241e.firebaseapp.com",
  databaseURL: "https://playwm-d241e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "playwm-d241e",
  storageBucket: "playwm-d241e.firebasestorage.app",
  messagingSenderId: "416539240115",
  appId: "1:416539240115:web:9667a06276935371a4f2c6",
  measurementId: "G-KV0S70CFSB"
};

let db = null;
let isOnline = false;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  isOnline = true;
} catch (e) {
  document.getElementById('modeBadge').innerText = "🤖 오프라인 모드";
}

/**
 * 2. 게임 상수 및 전역 변수
 */
const GRID_SIZE = 50;
const TILE_PIXEL = 26;
const COLORS = ['#FF2A85', '#00F0FF', '#00FF66', '#FFAA00', '#B537F2', '#FF5500', '#FFFF00', '#0088FF'];

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const miniCanvas = document.getElementById('minimapCanvas');
const miniCtx = miniCanvas.getContext('2d');

let myId = 'user_' + Math.random().toString(36).substr(2, 6);
let myColor = COLORS[Math.floor(Math.random() * COLORS.length)];
let coins = 10;

let grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
let players = {};
let mines = [];

let me = {
  id: myId, name: '', color: myColor,
  x: 5, y: 5, dx: 0, dy: 0,
  trail: [],
  shieldUntil: 0,
  speedUntil: 0,
  stunUntil: 0
};

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/**
 * 3. 밝은 배경음악 (Web Audio API)
 */
let audioCtx = null;
function startBGM() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25];
  let step = 0;
  setInterval(() => {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.22);
    step++;
  }, 240);
}

function playSound(freq, type = 'sine', duration = 0.2) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

/**
 * 4. 스폰 및 안전지대 체크
 */
function spawnPlayer(p, startX, startY) {
  p.x = startX;
  p.y = startY;
  p.trail = [];
  for (let r = startY - 1; r <= startY + 1; r++) {
    for (let c = startX - 1; c <= startX + 1; c++) {
      if (r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE) {
        grid[r][c] = p.id;
      }
    }
  }
  syncTerritoryToFirebase();
}

function isOuterBorder(x, y) {
  return x === 0 || y === 0 || x === GRID_SIZE - 1 || y === GRID_SIZE - 1;
}

function isSafeZone(p, x, y) {
  return grid[y][x] === p.id || isOuterBorder(x, y);
}

/**
 * 5. 영역 점령 알고리즘 (Flood Fill)
 */
function captureTerritory(p) {
  if (!p.trail || p.trail.length === 0) return;

  p.trail.forEach(([tx, ty]) => {
    const ownerId = grid[ty][tx];
    if (ownerId && players[ownerId] && players[ownerId].shieldUntil > Date.now()) return;
    grid[ty][tx] = p.id;
  });
  p.trail = [];

  let visited = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));
  let queue = [];

  for (let i = 0; i < GRID_SIZE; i++) {
    if (grid[0][i] !== p.id) { queue.push([i, 0]); visited[0][i] = true; }
    if (grid[GRID_SIZE - 1][i] !== p.id) { queue.push([i, GRID_SIZE - 1]); visited[GRID_SIZE - 1][i] = true; }
    if (grid[i][0] !== p.id) { queue.push([0, i]); visited[i][0] = true; }
    if (grid[i][GRID_SIZE - 1] !== p.id) { queue.push([GRID_SIZE - 1, i]); visited[i][GRID_SIZE - 1] = true; }
  }

  const dirs = [[1,0], [-1,0], [0,1], [0,-1]];
  while (queue.length > 0) {
    const [cx, cy] = queue.shift();
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy;
      if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
        if (!visited[ny][nx] && grid[ny][nx] !== p.id) {
          visited[ny][nx] = true;
          queue.push([nx, ny]);
        }
      }
    }
  }

  let capturedCount = 0;
  for (let y = 1; y < GRID_SIZE - 1; y++) {
    for (let x = 1; x < GRID_SIZE - 1; x++) {
      if (!visited[y][x] && grid[y][x] !== p.id) {
        const ownerId = grid[y][x];
        if (ownerId && players[ownerId] && players[ownerId].shieldUntil > Date.now()) continue;
        grid[y][x] = p.id;
        capturedCount++;
      }
    }
  }

  if (capturedCount > 0 && p.id === myId) {
    playSound(880, 'triangle', 0.3);
    showStatus(`+${capturedCount}칸 점령 성공!`);
  }
  syncTerritoryToFirebase();
}

/**
 * 6. 아이템 사용 로직
 */
function showStatus(msg) {
  const el = document.getElementById('statusMsg');
  el.innerText = msg;
  setTimeout(() => { if (el.innerText === msg) el.innerText = ''; }, 2500);
}

window.useItem = function(type) {
  const now = Date.now();
  if (type === 'shield') {
    if (coins < 5) return showStatus("코인이 부족합니다!");
    coins -= 5;
    me.shieldUntil = now + 6000;
    playSound(600, 'sine', 0.3);
    showStatus("🛡️ 6초간 내 땅 보호막 가동!");
  } else if (type === 'speed') {
    if (coins < 4) return showStatus("코인이 부족합니다!");
    coins -= 4;
    me.speedUntil = now + 5000;
    playSound(1000, 'sawtooth', 0.25);
    showStatus("⚡ 5초간 이동속도 업!");
  } else if (type === 'mine') {
    if (coins < 6) return showStatus("코인이 부족합니다!");
    coins -= 6;
    mines.push({ x: Math.round(me.x), y: Math.round(me.y), ownerId: myId, color: me.color });
    syncMinesToFirebase();
    playSound(300, 'square', 0.2);
    showStatus("💣 현재 위치에 지뢰 설치 완료!");
  } else if (type === 'bomb') {
    if (coins < 8) return showStatus("코인이 부족합니다!");
    coins -= 8;
    const cx = Math.round(me.x), cy = Math.round(me.y);
    for (let y = cy - 3; y <= cy + 3; y++) {
      for (let x = cx - 3; x <= cx + 3; x++) {
        if (y >= 0 && y < GRID_SIZE && x >= 0 && x < GRID_SIZE) {
          if (Math.hypot(x - cx, y - cy) <= 3.2) {
            grid[y][x] = myId;
          }
        }
      }
    }
    playSound(450, 'sawtooth', 0.4);
    showStatus("🎨 페인트 폭탄 작렬!");
    syncTerritoryToFirebase();
  }
  document.getElementById('coinText').innerText = coins;
};

/**
 * 7. 한 손 조이스틱 터치 이벤트
 */
const zone = document.getElementById('joystickZone');
const knob = document.getElementById('joystickKnob');
let joyActive = false;

function handleJoystick(clientX, clientY) {
  const rect = zone.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  let dx = clientX - centerX;
  let dy = clientY - centerY;
  const dist = Math.hypot(dx, dy);
  const maxDist = 42;

  if (dist > maxDist) {
    dx = (dx / dist) * maxDist;
    dy = (dy / dist) * maxDist;
  }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;

  if (dist > 8) {
    me.dx = dx / maxDist;
    me.dy = dy / maxDist;
  } else {
    me.dx = 0; me.dy = 0;
  }
}

zone.addEventListener('pointerdown', (e) => { joyActive = true; handleJoystick(e.clientX, e.clientY); });
window.addEventListener('pointermove', (e) => { if (joyActive) handleJoystick(e.clientX, e.clientY); });
window.addEventListener('pointerup', () => {
  joyActive = false;
  knob.style.transform = `translate(0px, 0px)`;
  me.dx = 0; me.dy = 0;
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp' || e.key === 'w') { me.dy = -1; me.dx = 0; }
  if (e.key === 'ArrowDown' || e.key === 's') { me.dy = 1; me.dx = 0; }
  if (e.key === 'ArrowLeft' || e.key === 'a') { me.dx = -1; me.dy = 0; }
  if (e.key === 'ArrowRight' || e.key === 'd') { me.dx = 1; me.dy = 0; }
});

/**
 * 8. 플레이어 이동 및 충돌 판정
 */
function updatePlayerLogic(p) {
  const now = Date.now();
  if (p.stunUntil > now) return;

  const speedMult = (p.speedUntil > now) ? 0.22 : 0.14;
  let nx = p.x + p.dx * speedMult;
  let ny = p.y + p.dy * speedMult;

  nx = Math.max(0, Math.min(GRID_SIZE - 1, nx));
  ny = Math.max(0, Math.min(GRID_SIZE - 1, ny));
  p.x = nx; p.y = ny;

  const gx = Math.round(p.x);
  const gy = Math.round(p.y);

  // 지뢰 충돌 체크
  for (let i = mines.length - 1; i >= 0; i--) {
    const m = mines[i];
    if (m.ownerId !== p.id && Math.hypot(gx - m.x, gy - m.y) <= 1.2) {
      mines.splice(i, 1);
      syncMinesToFirebase();
      p.stunUntil = now + 2500;
      p.trail = [];
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (grid[r][c] === p.id && Math.random() < 0.25) {
            grid[r][c] = 0;
          }
        }
      }
      syncTerritoryToFirebase();
      if (p.id === myId) {
        playSound(150, 'sawtooth', 0.5);
        showStatus("💥 지뢰를 밟아 기절 및 땅 일부가 파괴되었습니다!");
      }
      break;
    }
  }

  if (!p.trail) p.trail = [];

  if (isSafeZone(p, gx, gy)) {
    if (p.trail.length > 0) {
      captureTerritory(p);
    }
  } else {
    const lastPos = p.trail[p.trail.length - 1];
    if (!lastPos || lastPos[0] !== gx || lastPos[1] !== gy) {
      p.trail.push([gx, gy]);
    }
  }

  // 상대방 꼬리(선) 밟기 판정
  Object.values(players).forEach(other => {
    if (other.id === p.id || !other.trail) return;
    for (let i = 0; i < other.trail.length; i++) {
      const [tx, ty] = other.trail[i];
      if (tx === gx && ty === gy) {
        other.trail = [];
        const rx = Math.floor(Math.random() * (GRID_SIZE - 8)) + 4;
        const ry = Math.floor(Math.random() * (GRID_SIZE - 8)) + 4;
        if (isOnline && db) {
          db.ref('players/' + other.id).update({ x: rx, y: ry, trail: [] });
        }
        if (p.id === myId) {
          coins += 5;
          document.getElementById('coinText').innerText = coins;
          playSound(950, 'square', 0.25);
          showStatus(`⚔️ ${other.name} 처치! (+5 코인)`);
        }
        break;
      }
    }
  });
}

/**
 * 9. 렌더링 (메인 캔버스 + 미니맵 + 랭킹)
 */
function render() {
  ctx.fillStyle = '#12131a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const camX = canvas.width / 2 - me.x * TILE_PIXEL;
  const camY = canvas.height / 2 - me.y * TILE_PIXEL;

  ctx.save();
  ctx.translate(camX, camY);

  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      const px = x * TILE_PIXEL;
      const py = y * TILE_PIXEL;

      const ownerId = grid[y][x];
      if (ownerId && players[ownerId]) {
        ctx.fillStyle = players[ownerId].color + '88';
        ctx.fillRect(px, py, TILE_PIXEL, TILE_PIXEL);
        ctx.strokeStyle = players[ownerId].color;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(px, py, TILE_PIXEL, TILE_PIXEL);
      } else if (isOuterBorder(x, y)) {
        ctx.fillStyle = 'rgba(0, 240, 255, 0.12)';
        ctx.fillRect(px, py, TILE_PIXEL, TILE_PIXEL);
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.35)';
        ctx.strokeRect(px, py, TILE_PIXEL, TILE_PIXEL);
      } else {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        ctx.strokeRect(px, py, TILE_PIXEL, TILE_PIXEL);
      }
    }
  }

  mines.forEach(m => {
    ctx.beginPath();
    ctx.arc((m.x + 0.5) * TILE_PIXEL, (m.y + 0.5) * TILE_PIXEL, TILE_PIXEL * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = (m.ownerId === myId) ? '#ff2a85' : 'rgba(255, 42, 133, 0.18)';
    ctx.fill();
  });

  Object.values(players).forEach(p => {
    if (p.trail && p.trail.length > 0) {
      ctx.beginPath();
      p.trail.forEach(([tx, ty], idx) => {
        const cx = (tx + 0.5) * TILE_PIXEL;
        const cy = (ty + 0.5) * TILE_PIXEL;
        if (idx === 0) ctx.moveTo(cx, cy);
        else ctx.lineTo(cx, cy);
      });
      ctx.lineTo((p.x + 0.5) * TILE_PIXEL, (p.y + 0.5) * TILE_PIXEL);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    const cx = (p.x + 0.5) * TILE_PIXEL;
    const cy = (p.y + 0.5) * TILE_PIXEL;

    if (p.shieldUntil > Date.now()) {
      ctx.beginPath();
      ctx.arc(cx, cy, TILE_PIXEL * 0.75, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(cx, cy, TILE_PIXEL * 0.45, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 12;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.name, cx, cy - 14);
  });

  ctx.restore();
  renderMinimap();
}

function renderMinimap() {
  miniCtx.fillStyle = '#12131a';
  miniCtx.fillRect(0, 0, miniCanvas.width, miniCanvas.height);
  const scale = miniCanvas.width / GRID_SIZE;

  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      const ownerId = grid[y][x];
      if (ownerId && players[ownerId]) {
        miniCtx.fillStyle = players[ownerId].color;
        miniCtx.fillRect(x * scale, y * scale, scale, scale);
      } else if (isOuterBorder(x, y)) {
        miniCtx.fillStyle = 'rgba(0, 240, 255, 0.3)';
        miniCtx.fillRect(x * scale, y * scale, scale, scale);
      }
    }
  }
  miniCtx.fillStyle = '#ffffff';
  miniCtx.fillRect(me.x * scale - 1.5, me.y * scale - 1.5, 4, 4);
}

function updateLeaderboard() {
  const counts = {};
  const totalTiles = GRID_SIZE * GRID_SIZE;

  for (let y = 0; y < GRID_SIZE; y++) {
    for (let x = 0; x < GRID_SIZE; x++) {
      const owner = grid[y][x];
      if (owner) counts[owner] = (counts[owner] || 0) + 1;
    }
  }

  const list = Object.values(players).map(p => {
    const cnt = counts[p.id] || 0;
    const pct = ((cnt / totalTiles) * 100).toFixed(1);
    return { ...p, pct: parseFloat(pct) };
  }).sort((a, b) => b.pct - a.pct);

  const lbList = document.getElementById('lbList');
  lbList.innerHTML = list.slice(0, 6).map((p, idx) => `
    <div class="lb-row" style="${p.id === myId ? 'font-weight:bold; color:#ffd700;' : ''}">
      <div class="lb-name">
        <span>${idx + 1}.</span>
        <span class="color-dot" style="background:${p.color}"></span>
        <span>${p.name}</span>
      </div>
      <span>${p.pct}%</span>
    </div>
  `).join('');
}

/**
 * 10. FIREBASE 실시간 동기화
 */
function initFirebaseSync() {
  if (!isOnline || !db) return;

  const playerRef = db.ref('players/' + myId);
  playerRef.set(me);
  playerRef.onDisconnect().remove();

  db.ref('players').on('value', snap => {
    const data = snap.val() || {};
    Object.keys(data).forEach(uid => {
      if (uid !== myId) {
        players[uid] = data[uid];
        if (!players[uid].trail) players[uid].trail = [];
      } else if (data[myId]) {
        // 상대에게 킬 당해 리스폰된 경우 내 위치 동기화
        if (Math.hypot(data[myId].x - me.x, data[myId].y - me.y) > 8) {
          me.x = data[myId].x;
          me.y = data[myId].y;
          me.trail = [];
          showStatus("💀 상대에게 꼬리를 밟혀 리스폰되었습니다!");
        }
      }
    });
    Object.keys(players).forEach(uid => {
      if (uid !== myId && !data[uid]) delete players[uid];
    });
  });

  db.ref('territories').on('value', snap => {
    const data = snap.val();
    if (data) grid = data;
  });

  db.ref('mines').on('value', snap => {
    mines = snap.val() || [];
  });
}

function syncTerritoryToFirebase() {
  if (isOnline && db) db.ref('territories').set(grid);
}

function syncMinesToFirebase() {
  if (isOnline && db) db.ref('mines').set(mines);
}

/**
 * 11. 게임 시작
 */
document.getElementById('startBtn').addEventListener('click', () => {
  const inputName = document.getElementById('nicknameInput').value.trim();
  me.name = inputName || ('Player' + Math.floor(Math.random() * 90 + 10));
  players[myId] = me;

  const sx = Math.floor(Math.random() * 30) + 10;
  const sy = Math.floor(Math.random() * 30) + 10;

  if (isOnline && db) {
    // 기존 서버 땅 데이터를 먼저 불러온 뒤 내 초기 땅 스폰
    db.ref('territories').once('value', snap => {
      const existingGrid = snap.val();
      if (existingGrid) grid = existingGrid;
      spawnPlayer(me, sx, sy);
      initFirebaseSync();
    });
  } else {
    spawnPlayer(me, sx, sy);
  }

  document.getElementById('startScreen').style.display = 'none';
  startBGM();

  setInterval(() => {
    coins += 2;
    document.getElementById('coinText').innerText = coins;
  }, 5000);

  setInterval(updateLeaderboard, 500);

  function loop() {
    updatePlayerLogic(me);
    if (isOnline && db) {
      db.ref('players/' + myId).update({
        id: me.id, name: me.name, color: me.color,
        x: me.x, y: me.y, trail: me.trail,
        shieldUntil: me.shieldUntil, speedUntil: me.speedUntil
      });
    }
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
});
</script>
